name = "masteryau-dedications"
main = "src/index.js"
compatibility_date = "2026-11-01"

# The site calls https://api.masteryau.com/api/dedications.
# Requires masteryau.com to be a zone in the same Cloudflare account.
routes = [
  { pattern = "api.masteryau.com", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://masteryau.com,https://www.masteryau.com"

# Create with: npx wrangler kv namespace create DEDICATIONS
# then paste the printed id below.
[[kv_namespaces]]
binding = "DEDICATIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Admin password (never commit it): npx wrangler secret put ADMIN_TOKEN
